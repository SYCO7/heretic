[project]
name = "heretic-agent"
version = "0.1.0"
description = "Autonomous AI agent that finds business-logic vulnerabilities (BOLA/IDOR, price tampering, workflow bypass, data exposure) — Oracle-verified, ~0 false positives"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SYCO7" }]
keywords = ["security", "pentest", "business-logic", "bola", "idor", "agent", "llm", "appsec", "bugbounty"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# Core runtime — deliberately lean; LLM calls use httpx directly (no provider SDK).
dependencies = [
    "typer>=0.12",          # CLI
    "rich>=13",             # live terminal output
    "httpx>=0.27",          # HTTP client (targets + OpenAI-compatible LLM APIs)
    "pyyaml>=6",            # roe.yaml / accounts.yaml
    "pydantic>=2",          # config + schemas
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
browser = ["playwright>=1.45"]     # M2+ authenticated browser crawl (JS-heavy targets)
rag = ["chromadb>=0.5"]            # swap the RAG-lite keyword store for embeddings
gemini = ["google-genai>=0.3"]     # only if using the gemini-flash backend

[project.scripts]
heretic = "heretic.cli:app"

[project.urls]
Homepage = "https://github.com/SYCO7/heretic"
Repository = "https://github.com/SYCO7/heretic"
Issues = "https://github.com/SYCO7/heretic/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heretic"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "SIM"]
ignore = [
    "B008",    # typer REQUIRES typer.Option(...) as an argument default — idiomatic, not a bug
    "E501",    # long help strings / URLs; line-length is a soft guide here
    "UP042",   # `class X(str, Enum)` is intentional (JSON-friendly string enums)
]

[tool.ruff.lint.per-file-ignores]
"src/heretic/benchmark/fixtures.py" = ["E741"]   # mock router uses terse single-letter locals
